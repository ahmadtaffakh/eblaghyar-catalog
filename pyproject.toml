[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eblaghyar-catalog"
version = "0.1.0"
description = "Standalone intranet index for Eblaghyar notice packages"
requires-python = ">=3.11"

[project.scripts]
eblaghyar-catalog = "eblaghyar_catalog.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
